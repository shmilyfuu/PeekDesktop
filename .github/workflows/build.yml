name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/PeekDesktop/PeekDesktop.csproj

      - name: Run interop safety harness
        run: dotnet run --project src/PeekDesktop.InteropHarness/PeekDesktop.InteropHarness.csproj -- 10000

      - name: Set version environment variables
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME.TrimStart('v')
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION.TrimStart('v')
          } else {
            throw "A release version is required."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$version' is not a supported semantic version."
          }

          $numericVersion = ($version -split '-', 2)[0]
          $parts = $numericVersion.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]
          $assemblyVersion = "$major.$minor.$patch.0"

          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "FULLVERSION=$version" >> $env:GITHUB_ENV
          echo "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_ENV

      - name: Build x64
        shell: pwsh
        run: |
          dotnet publish src/PeekDesktop/PeekDesktop.csproj `
            -c Release `
            -r win-x64 `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            /p:FileVersion=$env:ASSEMBLY_VERSION `
            /p:AssemblyInformationalVersion=$env:FULLVERSION `
            --self-contained

      - name: Build ARM64
        shell: pwsh
        run: |
          dotnet publish src/PeekDesktop/PeekDesktop.csproj `
            -c Release `
            -r win-arm64 `
            /p:PublishSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:Version=$env:VERSION `
            /p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            /p:FileVersion=$env:ASSEMBLY_VERSION `
            /p:AssemblyInformationalVersion=$env:FULLVERSION `
            --self-contained

      - name: Prepare portable release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $version = $env:VERSION

          New-Item -ItemType Directory -Path temp-x64 -Force | Out-Null
          Copy-Item "src/PeekDesktop/bin/Release/net10.0-windows/win-x64/publish/PeekDesktop.exe" "temp-x64/PeekDesktop.exe"
          Compress-Archive -Path "temp-x64/PeekDesktop.exe" -DestinationPath "artifacts/PeekDesktop-v$version-win-x64.zip"

          New-Item -ItemType Directory -Path temp-arm64 -Force | Out-Null
          Copy-Item "src/PeekDesktop/bin/Release/net10.0-windows/win-arm64/publish/PeekDesktop.exe" "temp-arm64/PeekDesktop.exe"
          Compress-Archive -Path "temp-arm64/PeekDesktop.exe" -DestinationPath "artifacts/PeekDesktop-v$version-win-arm64.zip"

          Remove-Item temp-x64 -Recurse -Force
          Remove-Item temp-arm64 -Recurse -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PeekDesktop-Release
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$env:VERSION" }
          $ownerRepo = '${{ github.repository }}'
          $headSha = '${{ github.sha }}'

          gh release view $tag --repo $ownerRepo *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release '$tag' already exists; leaving it unchanged."
            exit 0
          }

          $notes = @"
          ## PeekDesktop $tag

          Portable Windows build of PeekDesktop with the custom native settings interface.

          ### Highlights
          - Fly Away can operate only on the clicked monitor.
          - Configurable Fly Away animation duration and frame rate.
          - Native single-window settings UI; left-click the tray icon to open it.
          - Tray right-click menu contains only Settings and Exit.
          - Portable data is stored under the Data folder beside PeekDesktop.exe.
          - Start with Windows uses an elevated Task Scheduler entry and removes it when disabled.
          - PeekDesktop always requests administrator privileges so it can manage elevated windows.
          - Automatic update checking is temporarily disabled.

          ### Downloads
          - `PeekDesktop-v$env:VERSION-win-x64.zip` — Intel/AMD 64-bit Windows
          - `PeekDesktop-v$env:VERSION-win-arm64.zip` — ARM64 Windows

          Each ZIP contains only `PeekDesktop.exe`. No .NET installation is required. No PDB files are included.

          Note: these builds are currently unsigned, so Windows may show an Unknown publisher/UAC warning.
          "@

          Set-Content release-notes.md $notes -Encoding UTF8

          gh release create $tag `
            --repo $ownerRepo `
            --target $headSha `
            --title "PeekDesktop $tag" `
            --notes-file release-notes.md `
            artifacts/*.zip
