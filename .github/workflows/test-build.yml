name: Test Build

on:
  push:
    branches:
      - feature/single-monitor-flyaway-animation
      - feature/winui-settings
  workflow_dispatch:

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore core
        run: dotnet restore src/PeekDesktop/PeekDesktop.csproj -r win-x64

      - name: Restore WinUI settings
        run: dotnet restore src/PeekDesktop.Settings/PeekDesktop.Settings.csproj -r win-x64

      - name: Publish NativeAOT core
        run: dotnet publish src/PeekDesktop/PeekDesktop.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo -o artifacts/stage/Core

      - name: Build WinUI settings
        id: build_winui
        continue-on-error: true
        run: dotnet build src/PeekDesktop.Settings/PeekDesktop.Settings.csproj -c Release -r win-x64 --no-restore --nologo -p:Platform=x64

      - name: Publish WinUI settings runtime
        id: publish_winui
        if: steps.build_winui.outcome == 'success'
        continue-on-error: true
        run: dotnet publish src/PeekDesktop.Settings/PeekDesktop.Settings.csproj -c Release -r win-x64 --no-restore --nologo -p:Platform=x64 -p:PublishProfile=win-x64

      - name: Show WinUI XAML compiler diagnostics
        if: steps.build_winui.outcome == 'failure' || steps.publish_winui.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host 'WinUI obj diagnostics:'
          Get-ChildItem 'src/PeekDesktop.Settings/obj' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('input.json','output.json') -or $_.Extension -eq '.log' } |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            }

      - name: Fail when WinUI build or publish failed
        if: steps.build_winui.outcome == 'failure' || steps.publish_winui.outcome == 'failure'
        shell: pwsh
        run: throw 'WinUI settings build/publish failed. See diagnostics above.'

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $core = Resolve-Path 'artifacts/stage/Core'
          $runtime = Resolve-Path 'artifacts/stage/Runtime'
          $dist = Join-Path $PWD 'artifacts/publish/win-x64'
          $runtimeDist = Join-Path $dist 'Runtime'
          $dataDist = Join-Path $dist 'Data'

          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $runtimeDist -ItemType Directory -Force | Out-Null
          New-Item $dataDist -ItemType Directory -Force | Out-Null

          Copy-Item (Join-Path $core 'PeekDesktop.exe') (Join-Path $dist 'PeekDesktop.exe') -Force
          Copy-Item (Join-Path $runtime '*') $runtimeDist -Recurse -Force

          if (!(Test-Path (Join-Path $runtimeDist 'PeekDesktop.Settings.exe'))) {
            throw 'Runtime/PeekDesktop.Settings.exe is missing.'
          }

          $unexpectedRootFiles = @(Get-ChildItem $dist -File | Where-Object Name -ne 'PeekDesktop.exe')
          if ($unexpectedRootFiles.Count -ne 0) {
            throw "Unexpected files in application root: $($unexpectedRootFiles.Name -join ', ')"
          }

          Write-Host 'Portable application root:'
          Get-ChildItem $dist | Sort-Object PSIsContainer,Name | Select-Object Name,PSIsContainer,Length | Format-Table -AutoSize
          Write-Host "Runtime files: $(@(Get-ChildItem $runtimeDist -File -Recurse).Count)"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: PeekDesktop-test-win-x64-winui
          path: artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 14
